[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-flowmap"
version = "0.1.0"
description = "Static AST visualizer, flow mapper, and dead-end linter for Telegram bots"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "w1bbex" }]
keywords = ["telegram", "telegram-bot", "ast", "flowchart", "visualizer", "linter"]
dependencies = []

[project.optional-dependencies]
dast = [
    "telethon>=1.36,<2",
]
cli = [
    "rich>=13.0",
    "questionary>=2.0",
]
full = [
    "tg-flowmap[dast,cli]",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tg-flowmap = "tg_flowmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tg_flowmap*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
tg_flowmap = [
    "visualizer/templates/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"


